name: Nexus Games CI

on:
  push:
    branches: [main, release/nexus-games-2.0, release/nexus-games-2.1, release/nexus-games-2.2]
  pull_request:
    branches: [main, release/nexus-games-2.0, release/nexus-games-2.1, release/nexus-games-2.2, release/nexus-games-2.3]

concurrency:
  group: nexus-games-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run format tests
        run: npm test
      - name: Build application
        run: npm run build
